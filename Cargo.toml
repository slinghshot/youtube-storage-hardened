[package]
name = "youtube-storage"
version = "0.3.0"
edition = "2021"

[dependencies]
aes-gcm = "0.10"
argon2 = "0.5"
cap-std = "3"
clap = { version = "4", features = ["derive"] }
rand = "0.8"
rpassword = "7"
tempfile = "3"
walkdir = "2"
zeroize = "1"
zip = { version = "=9.8.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[features]
lan = ["dep:axum","dep:tokio","dep:serde","dep:serde_json","dep:hex","dep:fs2","dep:async-stream","dep:nix","dep:hkdf","dep:sha2","dep:subtle","dep:url"]

[target.'cfg(target_os = "linux")'.dependencies]
axum = { version = "0.8", features = ["multipart"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "net", "fs", "io-util", "time", "sync"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
hex = { version = "0.4", optional = true }
fs2 = { version = "0.4", optional = true }
async-stream = { version = "0.3", optional = true }
nix = { version = "0.30", features = ["ioctl","signal"], optional = true }
hkdf = { version = "0.12", optional = true }
sha2 = { version = "0.10", optional = true }
subtle = { version = "2", optional = true }
url = { version = "2", optional = true }
